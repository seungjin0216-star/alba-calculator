<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png">

<title>알바비 계산기</title>
<!--
  알바비 계산기 v2 (2026-10-27) — 사장님 「알바비 계산 어플은 정확도가 가장 중요함. 지점별로 딱딱 정리되는 게 가장 편함.
  하단 탭이 너무 많고 중복되어 있어서 별로야」 → 탭 3개 (💵 급여 · 👥 사람 · ⚙️ 설정)
  ⚠️ 옛 화면은 옛화면.html 에 그대로 있음 (돌아갈 자리 · 지우지 않음)
  🔴 계산식(termFor · getHrsForDate · calcPayroll · calcTax)은 옛 화면과 같음 — 사장앱 owner/index.html 에도 같은 식이 있음 (고치면 둘 다)
  🔴 저장은 「최신을 받아 → 한 가지만 고쳐 → 보내고 → 다시 받아 확인」 (옛 화면은 폰에 있던 걸 통째로 보내 다른 폰 것을 덮을 수 있었음)
  데이터  알바 = 알바 GAS(AKfycbxGpa_) · 시트 「알바비데이터」 A1 한 칸 (사장앱 급여 탭과 같은 칸)
          직원 = 손익 GAS(AKfycbxKmN_) staffList/staffSave · 지점 손익 파일 「직원명부」 탭
-->
<style>
:root{--paper:#F2F4F6;--surface:#fff;--ink:#191F28;--muted:#8B95A1;--line:#E5E8EB;--accent:#3182F6;--up:#F04452;--done:#21A366;--warm:#E08A00;--soft:#F7F9FB}
@media (prefers-color-scheme:dark){:root{--paper:#101418;--surface:#1B2128;--ink:#F2F4F6;--muted:#8B95A1;--line:#2A323B;--soft:#232A32}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.2px;-webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;font-weight:800}
#sync{font-size:12px;color:var(--muted)}
.seg{display:flex;background:color-mix(in srgb,var(--muted) 16%,var(--paper));border-radius:12px;padding:3px;margin:10px 0 8px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:600;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0002}
.dial{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.dial>button{width:40px;height:40px;border-radius:50%;background:var(--surface);font-size:22px;color:var(--accent)}
.dial>button:disabled{opacity:.25}
.pill{position:relative;flex:1;text-align:center;font-weight:800;font-size:17px;padding:9px;border-radius:12px;background:var(--surface)}
.pill input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.card{background:var(--surface);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.hero .k{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 8px}
.hero .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.hero .grid div{font-size:12px;color:var(--muted)}.hero .grid b{display:block;font-size:15px;color:var(--ink)}
h2{font-size:14px;color:var(--muted);font-weight:700;margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-weight:500}
.list{background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}.row .main b{font-weight:700}.row .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.row .net{text-align:right}.row .net b{font-size:18px;font-weight:800;display:block}.row .net small{font-size:11.5px;color:var(--muted)}
.pay{flex:none;border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:700;background:#E8F3FF;color:var(--accent)}
.pay.on{background:var(--done);color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:1px;background:var(--soft);color:var(--muted)}
.tag.red{background:#FFEBEE;color:var(--up)}.tag.amb{background:#FFF4E0;color:var(--warm)}.tag.ok{background:#E3F6EC;color:var(--done)}
.big-btn{display:block;width:100%;border-radius:16px;padding:15px;font-weight:700;font-size:16px;background:var(--accent);color:#fff;margin-top:10px}
.big-btn.sec{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.big-btn.red{background:#FFEBEE;color:var(--up)}
.big-btn:disabled{opacity:.4}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}nav button{flex:1;padding:9px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400}nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.ov{position:fixed;inset:0;z-index:20;background:#0008;display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:10px}
.fld{margin:10px 0}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:17px;background:var(--surface)}
.in:focus{outline:0;border-color:var(--accent)}
.money-hint{font-size:13px;color:var(--accent);font-weight:700;margin-top:4px;min-height:18px}
.days{display:flex;gap:5px}.days button{flex:1;padding:9px 0;border-radius:10px;background:var(--soft);font-weight:700;color:var(--muted)}
.days button.on{background:var(--accent);color:#fff}
.tt{display:grid;grid-template-columns:44px 1fr 14px 1fr;gap:6px;align-items:center;margin-top:6px}.tt select{padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);padding:2px 0}.cal .h:first-child{color:var(--up)}
.cal button{min-height:52px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cal button small{font-size:10px;font-weight:600}
.cal .work{background:#E8F3FF;color:var(--accent)}.cal .absent{background:#FFEBEE;color:var(--up)}.cal .changed{background:#FFF4E0;color:var(--warm)}.cal .off{opacity:.35}
.calc .r{display:flex;justify-content:space-between;padding:7px 2px;font-size:15px}.calc .r.t{border-top:1px solid var(--line);font-weight:800}
.calc .r.net{font-size:19px;font-weight:800;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#191F28;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none;max-width:90%}.toast.show{opacity:1}
#busy{position:fixed;inset:0;z-index:40;background:#0004;display:none;align-items:center;justify-content:center}#busy.show{display:flex}
#busy div{background:var(--surface);border-radius:16px;padding:16px 22px;font-weight:700}
details.past summary{list-style:none;cursor:pointer;padding:12px 4px;color:var(--muted);font-weight:700;font-size:14px}details.past summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1 id="ttl">💵 급여</h1><span id="sync"></span></div>
  <div class="seg" id="brSeg"></div>
  <div class="dial" id="dial"></div>
</div></header>
<main class="wrap" id="main"><div class="empty">불러오는 중…</div></main>
<nav><div class="wrap" id="nav"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="busy"><div>저장 중… 잠시만요</div></div>

<script>
const APP_VERSION='2026-10-27-v2'
const ALBA_URL='https://script.google.com/macros/s/AKfycbxGpa_Zyok-eV63Otf3C-WpVpiOt8gb4_W18g097IEL9iCUdlBrhMuNltU49u_Cuy5zNQ/exec'
const STAFF_URL='https://script.google.com/macros/s/AKfycbxKmN_Uo5hIGPm8ITQhM80FxinEL6q1dFiHZAaGR-eRsBb9EDno4C8et31a4mvwzkU9/exec'
const albaUrl=()=>localStorage.getItem('alba_script_url')||ALBA_URL
const staffUrl=()=>localStorage.getItem('staff_api_url')||STAFF_URL
/* 🏚 발산점 폐업 (26-10-27 사장님 「시트에 데이터가 있다면 어플에서는 지워줘. 추후 문제가 생길 시 시트 데이터를 기반으로」)
   → 앱에서만 안 보임 · 시트의 발산 기록은 그대로 */
const HIDDEN_BRANCHES=['발산점']
const STAFF_BRANCHES=['백석점','원당점']
const DAY=['일','월','화','수','목','금','토']
const $=s=>document.querySelector(s)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원'
const 만=n=>{ n=Math.round(n||0); if(!n) return ''; const m=Math.floor(n/10000), r=n%10000; return '= '+(m?m.toLocaleString()+'만':'')+(r?(m?' ':'')+r.toLocaleString():'')+'원' }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5)
const fmtMonth=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
const dateStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
const parseYM=ym=>{const[y,m]=ym.split('-').map(Number);return{y,m}}
const daysIn=(y,m)=>new Date(y,m,0).getDate()
const prevYM=ym=>{const{y,m}=parseYM(ym);return fmtMonth(new Date(y,m-2,1))}
const nextYM=ym=>{const{y,m}=parseYM(ym);return fmtMonth(new Date(y,m,1))}
let tt; function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),2200) }
function openSheet(h){ $('#sheet').innerHTML=h; $('#ov').classList.add('show') }
function closeSheet(){ $('#ov').classList.remove('show') }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet() })

/* ══════════ 계산 — 옛 화면과 같은 식 (바꾸지 말 것 · 사장앱도 같음) ══════════ */
const S={branches:[],workers:[],exceptions:[],payments:[],summaryExclude:[]}
function hoursBetween(s,e){ if(!s||!e) return 0; const[sh,sm]=String(s).split(':').map(Number),[eh,em]=String(e).split(':').map(Number); let mins=(eh*60+em)-(sh*60+sm); if(mins<=0) mins+=1440; return mins/60 }
function legacyTerm(w){ const days={}; (w.workDays||[]).forEach(d=>{ days[d]={start:w.startTime||'09:00',end:w.endTime||'18:00'} }); return{from:'',hourlyWage:w.hourlyWage||0,fixed:w.fixed!==false,days} }
function termsOf(w){ if(Array.isArray(w.terms)&&w.terms.length) return w.terms.slice().sort((a,b)=>String(a.from||'').localeCompare(String(b.from||''))); return[legacyTerm(w)] }
function termFor(w,ym){ const ts=termsOf(w); let c=ts[0]; ts.forEach(t=>{ const f=String(t.from||''); if(!f||f<=ym) c=t }); return c }
function isFixedIn(w,ym){ return termFor(w,ym).fixed!==false }
function termWorks(t,dow){ return !!(t&&t.days&&t.days[dow]) }
function termDayHours(t,dow){ const d=t&&t.days&&t.days[dow]; return d?hoursBetween(d.start,d.end):0 }
const wageOf=(w,ym)=>Number(termFor(w,ym).hourlyWage)||0
/* 🔴 입사·퇴사 (26-10-27 사장님 「퇴사 날짜 정해지면 그 이후로는 아예 앱에는 안 떠야 · 3~5월로 넘어가면 기존 데이터는 남아 있어야」)
   startYM / resignDate 는 「2026-05」(달) 또는 「2026-05-17」(날짜) 둘 다 됨
   달이면 그 달 전체 · 날짜면 그날부터 / 그날까지만 근무로 계산 · 그다음 달부터는 목록에도 안 뜸 */
function employedInMonth(w,ym){ const st=String(w.startYM||'').trim(), en=String(w.resignDate||'').trim(); if(st&&ym<st.slice(0,7)) return false; if(en&&ym>en.slice(0,7)) return false; return true }
function employedOn(w,ds){ if(!employedInMonth(w,ds.slice(0,7))) return false; const st=String(w.startYM||'').trim(), en=String(w.resignDate||'').trim(); if(st.length===10&&ds<st) return false; if(en.length===10&&ds>en) return false; return true }
function getHrsForDate(w,ds){
  if(!employedOn(w,ds)) return 0
  const dt=new Date(ds+'T00:00:00'), term=termFor(w,ds.slice(0,7)), isWork=termWorks(term,dt.getDay())
  const exc=S.exceptions.find(e=>e.wid===w.id&&e.date===ds), regH=termDayHours(term,dt.getDay())
  if(exc){ if(exc.type==='absent') return 0; if(exc.type==='override'||exc.type==='extra') return exc.hours
    if(exc.type==='time_override') return hoursBetween(exc.startTime,exc.endTime) }
  return isWork?regH:0
}
function getRegHrsForDate(w,ds){ if(!employedOn(w,ds)) return 0; return termDayHours(termFor(w,ds.slice(0,7)),new Date(ds+'T00:00:00').getDay()) }
function calcTax(g){ const income=Math.round(g*0.03),local=Math.round(g*0.003); return{income,local,total:income+local} }
function calcPayroll(w,ym){
  const{y,m}=parseYM(ym), dim=daysIn(y,m), wage=wageOf(w,ym)
  let totalHours=0; for(let d=1;d<=dim;d++) totalHours+=getHrsForDate(w,dateStr(new Date(y,m-1,d)))
  let totalJuHyu=0; const weeks=[]
  for(let d=1;d<=dim;d++){ const sun=new Date(y,m-1,d); if(sun.getDay()!==0) continue; const mon=new Date(sun); mon.setDate(mon.getDate()-6); let wH=0
    for(let i=0;i<7;i++){ const day=new Date(mon); day.setDate(day.getDate()+i); const ds=dateStr(day); wH+=(day.getFullYear()===y&&day.getMonth()+1===m)?getHrsForDate(w,ds):getRegHrsForDate(w,ds) }
    const j=wH>=15?(Math.min(wH,40)/40)*8*wage:0; weeks.push({label:`${mon.getMonth()+1}/${mon.getDate()}~${sun.getMonth()+1}/${sun.getDate()}`,hours:wH,juHyu:j,ok:wH>=15}); totalJuHyu+=j }
  const basePay=totalHours*wage, gross=basePay+totalJuHyu, tax=calcTax(gross)
  return{w,wage,totalHours,totalJuHyu,basePay,gross,tax,net:gross-tax.total,weeks}
}
/* 지급완료한 달은 그때 확정한 금액 그대로 (옛 화면·사장앱과 같음) */
function payOf(w,ym){ const r=calcPayroll(w,ym), p=S.payments.find(x=>x.wid===w.id&&x.ym===ym); return p?{...r,gross:+p.gross||0,net:+p.net||0,basePay:+p.basePay||0,totalJuHyu:+p.juHyu||0,paid:p}:r }

/* ══════════ 저장 — 최신을 받아 한 가지만 고쳐 보냄 ══════════ */
async function fetchAlba(){ const r=await fetch(albaUrl()+'?t='+Date.now()); const j=await r.json(); if(!j.ok||!j.data||!Array.isArray(j.data.workers)) throw new Error('알바 데이터를 못 받았습니다'); return j.data }
function useData(d){ S.branches=d.branches||[]; S.workers=d.workers||[]; S.exceptions=d.exceptions||[]; S.payments=d.payments||[]; S.summaryExclude=d.summaryExclude||[]; try{ localStorage.setItem('alba_v3',JSON.stringify(d)) }catch(e){} }
let 받음=false
async function pull(){ try{ useData(await fetchAlba()); 받음=true; $('#sync').textContent='✓ 최신' }catch(e){ $('#sync').textContent='⚠️ 못 받음 · '+e.message } render() }
async function op(fn,msg){
  if(!받음){ toast('아직 최신 데이터를 못 받았습니다 — 잠시 뒤에'); return false }
  $('#busy').classList.add('show')
  try{
    const d=await fetchAlba(), before={w:d.workers.length,p:(d.payments||[]).length}
    fn(d)
    if(d.workers.length<before.w) throw new Error('알바 수가 줄었습니다 — 저장하지 않았습니다')
    const body=JSON.stringify({branches:d.branches,workers:d.workers,exceptions:d.exceptions||[],payments:d.payments||[],summaryExclude:d.summaryExclude||[]})
    if(body.length>49000) throw new Error('데이터가 시트 한 칸 한도에 가까워 저장하지 않았습니다')
    await fetch(albaUrl(),{method:'POST',headers:{'Content-Type':'text/plain'},body}).catch(()=>{})   // 답장은 못 읽을 수 있음 (CORS) — 아래에서 다시 받아 확인
    let ok=false; for(const w of [1200,2500,4000]){ await new Promise(r=>setTimeout(r,w)); try{ const n=await fetchAlba(); if(JSON.stringify(n.workers)===JSON.stringify(d.workers)&&JSON.stringify(n.exceptions||[])===JSON.stringify(d.exceptions||[])&&JSON.stringify(n.payments||[])===JSON.stringify(d.payments||[])&&JSON.stringify(n.summaryExclude||[])===JSON.stringify(d.summaryExclude||[])){ useData(n); ok=true; break } }catch(e){} }
    if(!ok) throw new Error('저장이 확인되지 않았습니다 — 새로고침해서 확인해 주세요')
    toast('✓ '+msg); return true
  }catch(e){ toast('⚠️ '+e.message); try{ useData(await fetchAlba()) }catch(_){} return false }
  finally{ $('#busy').classList.remove('show'); render() }
}
/* 직원 (손익 GAS 직원명부) */
let STAFF=null
async function pullStaff(){ try{ const r=await fetch(staffUrl()+'?action=staffList&t='+Date.now()); const j=await r.json(); if(!j.ok) throw new Error(j.error||'직원 못 받음'); STAFF=(j.data&&j.data.staff)||[] }catch(e){ STAFF=STAFF||[]; toast('⚠️ 직원 목록 · '+e.message) } render() }
async function staffSave(staff){ $('#busy').classList.add('show'); try{ const r=await fetch(staffUrl(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'staffSave',staff})}); const j=await r.json().catch(()=>({ok:true})); if(j.ok===false) throw new Error(j.error||'저장 실패'); return true }catch(e){ toast('⚠️ '+e.message); return false }finally{ $('#busy').classList.remove('show') } }
const ym2=v=>{ const m=String(v||'').match(/(\d{4})\D+(\d{1,2})/); return m?`${m[1]}-${m[2].padStart(2,'0')}`:'' }
function staffActive(ym){ return (STAFF||[]).filter(s=>{ const st=ym2(s['시작연월']), en=ym2(s['종료연월']); if(st&&ym<st) return false; if(en&&ym>en) return false; return true }) }

/* ══════════ 상태 · 그리기 ══════════ */

  return `<div class="card"><b>데이터</b><p class="hint">알바 ${S.workers.length}명 (발산 포함 시트 전체) · 지급 기록 ${S.payments.length}개 · 바뀐 날 ${S.exceptions.length}개</p>

    <div class="card"><b>서버 주소</b><p class="hint" style="word-break:break-all">알바: ${esc(albaUrl())}<br>직원: ${esc(staffUrl())}</p></div>
    <div class="card"><b>옛 화면</b><p class="hint">예전 화면이 필요하면 → <a href="옛화면.html" style="color:var(--accent)">옛화면.html</a> (같은 데이터 · ⚠️ 옛 화면은 폰에 있던 걸 통째로 저장하니 되도록 쓰지 않기)</p></div>
    <p class="hint" style="text-align:center">${APP_VERSION}</p>`
}

/* ══════════ 누르기 ══════════ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-close]'); if(!b) return
  const d=b.dataset
  if(d.tab){ UI.tab=d.tab; render(); window.scrollTo(0,0); return }
  if(d.br){ UI.branch=d.br; render(); return }
  if(d.mo){ UI.month=d.mo; render(); return }
  if(d.close){ closeSheet(); return }
  if(d.cal){ 근무표(d.cal); return }
  if(d.back){ 근무표(d.back); return }
  if(d.day){ 날짜창(d.w,d.day); return }
  if(d.dop){ const wid=d.w, ds=d.ds, k=d.dop, st=$('#dS')&&$('#dS').value, en=$('#dE')&&$('#dE').value
    if(k==='time'&&st===en){ toast('시작과 끝이 같습니다'); return }
    const ok=await op(D=>{ D.exceptions=(D.exceptions||[]).filter(x=>!(x.wid===wid&&x.date===ds))
      if(k==='absent') D.exceptions.push({id:uid(),wid,date:ds,type:'absent',hours:0})
      if(k==='time') D.exceptions.push({id:uid(),wid,date:ds,type:'time_override',startTime:st,endTime:en,hours:0}) }, k==='absent'?'결근으로 넣었습니다':k==='time'?'시간을 넣었습니다':'원래대로 했습니다')
    if(ok) 근무표(wid); return }
  if(d.pay){ const w=S.workers.find(x=>x.id===d.pay), ym=UI.month, r=calcPayroll(w,ym)
    if(!confirm(`${w.name} ${parseYM(ym).m}월 세후 ${won(r.net)}\n지급완료로 확정할까요?`)) return
    await op(D=>{ D.payments=D.payments||[]; if(!D.payments.some(p=>p.wid===w.id&&p.ym===ym)) D.payments.push({id:uid(),wid:w.id,ym,paidAt:new Date().toISOString(),gross:Math.round(r.gross),net:Math.round(r.net),basePay:Math.round(r.basePay),juHyu:Math.round(r.totalJuHyu)}) }, `${w.name} 지급완료`); return }
  if(d.unpay){ const w=S.workers.find(x=>x.id===d.unpay), ym=UI.month; if(!confirm(`${w.name} ${parseYM(ym).m}월 지급완료를 취소할까요?`)) return
    await op(D=>{ D.payments=(D.payments||[]).filter(p=>!(p.wid===w.id&&p.ym===ym)) }, '지급 취소'); return }
  if(d.excl){ const on=d.on==='1', wid=d.excl; const ok=await op(D=>{ D.summaryExclude=(D.summaryExclude||[]).filter(x=>x!==wid); if(on) D.summaryExclude.push(wid) }, on?'신고에서 뺐습니다':'신고에 넣었습니다'); if(ok) 근무표(wid); return }
  if(b.id==='copyTax'){ const ym=UI.month, ex=new Set(S.summaryExclude), ws=S.workers.filter(w=>w.branchId===UI.branch&&employedInMonth(w,ym)&&!ex.has(w.id))
    if(!ws.length){ toast('복사할 사람이 없습니다'); return }
    const txt=[`${지점이름()} ${parseYM(ym).m}월 세후급여`].concat(ws.map(w=>`${w.name} ${won(payOf(w,ym).net)}`)).join('\n')
    try{ await navigator.clipboard.writeText(txt); toast('📋 복사했습니다') }catch(_){ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('📋 복사했습니다') } return }
  if(d.ew){ 알바창(d.ew); return }
  if(d.fx!=null){ 알바창읽기(); EW.fixed=d.fx==='1'; 그리기알바창(EW.id?S.workers.find(x=>x.id===EW.id):null); return }
  if(d.wd!=null){ 알바창읽기(); const k=d.wd; if(EW.days[k]) delete EW.days[k]; else { const f=Object.values(EW.days)[0]; EW.days[k]=f?{...f}:{start:'18:00',end:'23:00'} } 그리기알바창(EW.id?S.workers.find(x=>x.id===EW.id):null); return }
  if(b.id==='aSave'){ 알바창읽기(); const wage=Number(EW.wage)||0; if(!wage){ toast('시급을 넣어 주세요'); return } if(EW.fixed&&!Object.keys(EW.days).length){ toast('요일을 골라 주세요'); return }
    const term={from:'',hourlyWage:wage,fixed:EW.fixed,days:EW.fixed?EW.days:{}}
    if(!EW.id){ const name=($('#aName').value||'').trim(), st=$('#aStart').value; if(!name){ toast('이름을 넣어 주세요'); return }
      const ok=await op(D=>{ D.workers.push({id:uid(),name,branchId:UI.branch,startYM:st,terms:[term]}) }, `${name} 추가`); if(ok) closeSheet(); return }
    if(!EW.from){ toast('언제부터인지 골라 주세요'); return }
    term.from=EW.from; const id=EW.id
    const ok=await op(D=>{ const w=D.workers.find(x=>x.id===id); if(!w) throw new Error('알바를 못 찾았습니다'); const ts=termsOf(w).filter(t=>String(t.from||'')!==term.from); ts.push(term); w.terms=ts.sort((a,b)=>String(a.from||'').localeCompare(String(b.from||''))) }, `${EW.from}부터 새 조건`); if(ok) closeSheet(); return }
  if(b.id==='aResign'){ const en=$('#aEnd').value, id=EW.id, w=S.workers.find(x=>x.id===id); if(!en){ toast('마지막 근무일을 골라 주세요'); return } if(!confirm(`${w.name} — ${en}까지 근무하고 퇴사\n다음 달부터 앱에 안 뜹니다. 할까요?`)) return
    const ok=await op(D=>{ const x=D.workers.find(v=>v.id===id); x.resigned=true; x.resignDate=en }, `${w.name} 퇴사 처리`); if(ok) closeSheet(); return }
  if(b.id==='aBack'){ const id=EW.id; const ok=await op(D=>{ const x=D.workers.find(v=>v.id===id); delete x.resigned; delete x.resignDate }, '복직 처리'); if(ok) closeSheet(); return }
  if(d.es){ 직원창(d.es); return }
  if(b.id==='sAdd'){ const name=($('#sName').value||'').trim(), pay=금액('#sPay'); if(!name||!pay){ toast('이름과 월급을 넣어 주세요'); return }
    if(await staffSave({id:'',이름:name,지점:$('#sBr').value,월급:pay,시작연월:$('#sStart').value,종료연월:'',메모:''})){ closeSheet(); toast('✓ 직원 추가'); await pullStaff() } return }
  if(b.id==='sRaise'){ const s=window._직원, from=$('#sFrom').value, pay=금액('#sPay'); if(!from||!pay){ toast('언제부터와 새 월급을 넣어 주세요'); return }
    const st=ym2(s['시작연월']); if(st&&from<=st){ toast('시작한 달보다 뒤여야 합니다'); return }
    if(!confirm(`${s['이름']} — ${prevYM(from)}까지 ${won(Number(s['월급'])||0)}, ${from}부터 ${won(pay)}\n이렇게 바꿀까요?`)) return
    const a=await staffSave({id:s['id'],이름:s['이름'],지점:s['지점'],월급:Number(s['월급'])||0,시작연월:ym2(s['시작연월']),종료연월:prevYM(from),메모:s['메모']||''})
    const b2=a&&await staffSave({id:'',이름:s['이름'],지점:s['지점'],월급:pay,시작연월:from,종료연월:ym2(s['종료연월']),메모:s['메모']||''})
    if(b2){ closeSheet(); toast('✓ '+from+'부터 새 월급'); await pullStaff() } return }
  if(b.id==='sResign'){ const s=window._직원, en=$('#sEnd').value; if(!en) return; if(!confirm(`${s['이름']} — ${en}까지 근무하고 퇴사. 할까요?`)) return
    if(await staffSave({id:s['id'],이름:s['이름'],지점:s['지점'],월급:Number(s['월급'])||0,시작연월:ym2(s['시작연월']),종료연월:en,메모:s['메모']||''})){ closeSheet(); toast('✓ 퇴사 처리'); await pullStaff() } return }
  if(b.id==='reload'){ await pull(); await pullStaff(); toast('✓ 다시 받았습니다'); return }
  if(b.id==='dl'){ const blob=new Blob([JSON.stringify({...S,staff:STAFF},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='알바백업_'+dateStr(new Date())+'.json'; a.click(); return }
})
document.addEventListener('change',e=>{ if(e.target.id==='moPick'&&e.target.value){ UI.month=e.target.value; render() } })
/* 💰 금액 칸 — 쉼표 바로 · 아래 「= 120만원」 (사장님 「표가 없으니 십만 원인지 백만 원인지 인지하기 어렵고 … 1원씩 올라가 전혀 필요 없는 기능」) */
document.addEventListener('input',e=>{ const t=e.target; if(!['aWage','sPay'].includes(t.id)) return
  const n=t.value.replace(/[^0-9]/g,''); t.value=n?Number(n).toLocaleString():''; const h=$('#'+t.id+'H'); if(h) h.textContent=만(n) })

/* ══════════ 시작 ══════════ */
// 전달에 아직 지급 안 한 사람이 있으면 전달부터 보여 줌 (옛 화면과 같음 · 보통 월초에 지난달 급여를 줌)
{ const now=fmtMonth(new Date()), pm=prevYM(now); if(S.workers.some(w=>!HIDDEN_BRANCHES.includes((S.branches.find(b=>b.id===w.branchId)||{}).name)&&employedInMonth(w,pm)&&!S.payments.some(p=>p.wid===w.id&&p.ym===pm))) UI.month=pm }
render(); pull(); pullStaff()
</script>
